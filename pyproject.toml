[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "omnijev"
version = "0.3.0"
description = "Multimodal finite-choice decisions and a reproducible MuJoCo workbench"
requires-python = ">=3.9"
dependencies = []

[tool.setuptools.packages.find]
include = ["omnijev*"]

[tool.setuptools.package-data]
omnijev = ["web/*.html"]
