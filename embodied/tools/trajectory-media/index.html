<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>OmniJev trajectory media renderer</title>
    <style>
      :root {
        --line: #dce3e2;
        --muted: #75827f;
        --green: #087968;
        --red: #bf453f;
        --panel: #ffffff;
        --ink: #20282b;
        --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI",
          "PingFang SC", "Microsoft YaHei", sans-serif;
        color: var(--ink);
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; background: #eef2f1; }

      #stage { position: relative; display: flex; width: 1280px; height: 720px; overflow: hidden; }
      #viewport { position: relative; width: 940px; height: 720px; flex: 0 0 940px; }
      #viewport canvas { display: block; }

      #panel {
        flex: 1 1 auto; min-width: 0; background: var(--panel);
        border-left: 1px solid var(--line); padding: 26px 24px 22px;
        display: flex; flex-direction: column;
      }
      .eyebrow {
        font-family: var(--mono); font-size: 11.5px; letter-spacing: 0.13em;
        text-transform: uppercase; color: var(--muted); line-height: 1.5;
      }
      h1 { font-size: 26px; font-weight: 680; margin: 7px 0 0; letter-spacing: -0.015em; line-height: 1.2; }
      .sub { font-size: 13.5px; color: var(--muted); margin-top: 5px; line-height: 1.5; }
      hr { border: 0; border-top: 1px solid var(--line); margin: 16px 0; }

      .cycle { font-family: var(--mono); font-size: 13.5px; color: var(--muted); letter-spacing: 0.04em; }
      .cycle b { color: var(--ink); font-size: 15px; }
      .phase { font-size: 34px; font-weight: 680; letter-spacing: -0.02em; line-height: 1.05; margin: 3px 0 8px; }
      .tag {
        display: inline-block; font-family: var(--mono); font-size: 14px; font-weight: 600;
        color: var(--green); background: #e8f4f0; border: 1px solid #cbe4dc;
        border-radius: 5px; padding: 2px 9px;
      }
      .num { font-family: var(--mono); font-size: 14px; color: var(--muted); }
      .rows { font-size: 13.5px; color: var(--muted); line-height: 1.85; }
      .rows b { color: var(--ink); font-weight: 600; }
      .rows code { font-family: var(--mono); font-size: 12px; }
      .spacer { flex: 1 1 auto; }

      .track {
        position: relative; height: 7px; border-radius: 999px;
        background: #f1f5f4; border: 1px solid var(--line); overflow: hidden;
      }
      .fill { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--green); border-radius: 999px; }
      .ticks { position: absolute; left: 0; right: 0; top: -12px; height: 8px; }
      .tick { position: absolute; width: 1px; height: 6px; background: #cfdad8; }
      .tick.done { background: var(--green); }
      .tlabel {
        display: flex; justify-content: space-between; margin-top: 8px;
        font-family: var(--mono); font-size: 12.5px; color: var(--muted);
      }
      .note { font-size: 12px; color: #93a29e; margin-top: 12px; line-height: 1.5; }

      #verdict {
        position: absolute; left: 470px; top: 30px; transform: translateX(-50%);
        display: flex; align-items: center; gap: 9px; opacity: 0;
        background: var(--green); color: #fff; border-radius: 999px; padding: 9px 20px;
        font-size: 16px; font-weight: 650; box-shadow: 0 10px 24px rgba(8, 121, 104, 0.3);
        transition: opacity 0.3s ease;
      }
      #verdict.on { opacity: 1; }
      #verdict small { font-family: var(--mono); font-size: 11.5px; font-weight: 500; opacity: 0.92; }

      #watermark {
        position: absolute; left: 20px; bottom: 16px;
        font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em;
        color: #9aa9a5; text-transform: uppercase;
      }
      /* Offline capture: no transitions, so every screenshot is a settled state. */
      body.instant * { transition: none !important; animation: none !important; }
    </style>
  </head>
  <body>
    <div id="stage">
      <div id="viewport"></div>
      <div id="verdict">SUCCESS <small id="verdict-sub">physical final state</small></div>
      <div id="watermark">saved episode · offline replay</div>

      <aside id="panel">
        <div class="eyebrow">OmniJev · Embodied workbench</div>
        <h1 id="task-name">—</h1>
        <div class="sub" id="task-sub">—</div>
        <hr />

        <div class="cycle">CYCLE <b id="cycle-now">0</b> / <span id="cycle-total">0</span></div>
        <div class="phase" id="phase-name">—</div>
        <div><span class="tag" id="choice-tag">—</span>&nbsp; <span class="num" id="prob-line">—</span></div>
        <div class="num" id="latency-line" style="margin-top: 7px">—</div>
        <hr />

        <div class="rows" id="spec-rows"></div>
        <div class="spacer"></div>

        <div class="track">
          <div class="ticks" id="ticks"></div>
          <div class="fill" id="progress"></div>
        </div>
        <div class="tlabel">
          <span id="frame-label">0000 / 0000</span>
          <span id="time-label">t = 0.00 s</span>
        </div>
        <div class="note" id="note"></div>
      </aside>
    </div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
